<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kharú Management</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      min-height:140vh;
      background:linear-gradient(135deg,#001E44,#003B7A,#0A5EB0);
      color:white;
      overflow-x:hidden;
    }

    .container{
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      height:100vh;
      text-align:center;
      padding:20px;
    }

    h1{
      font-size:70px;
      margin-bottom:10px;
    }

    .subtitle{
      color:#dbeaff;
      margin-bottom:40px;
      font-size:20px;
    }

    .card{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      backdrop-filter:blur(10px);
      padding:35px;
      border-radius:25px;
      width:400px;
    }

    .btn{
      display:block;
      width:100%;
      padding:15px;
      margin-top:15px;
      border:none;
      border-radius:15px;
      background:white;
      color:#003B7A;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      text-decoration:none;
    }

    .btn:hover{
      background:#dbeaff;
    }

    .code-btn{
      position:fixed;
      bottom:20px;
      left:20px;
      padding:10px 16px;
      border:none;
      border-radius:12px;
      background:white;
      color:#003B7A;
      font-weight:bold;
      cursor:pointer;
    }

    .popup{
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      background:#0b2e5e;
      padding:25px;
      border-radius:20px;
      width:320px;
      display:none;
      z-index:999;
      box-shadow:0 0 25px rgba(0,0,0,0.5);
    }

    .popup h2{
      margin-bottom:15px;
    }

    .popup input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      outline:none;
    }

    .popup button{
      width:100%;
      margin-top:15px;
      padding:12px;
      border:none;
      border-radius:10px;
      background:white;
      color:#003B7A;
      font-weight:bold;
      cursor:pointer;
    }

    .status{
      margin-top:10px;
      color:#dbeaff;
      font-size:14px;
    }

    footer{
      position:fixed;
      bottom:20px;
      right:20px;
      color:#dbeaff;
      font-size:14px;
    }
  </style>
</head>
<body>

  <div class="container">

    <h1>🛡️ Kharú Management</h1>

    <div class="subtitle">
      Professional Session Hosting & Training System
    </div>

    <div class="card">

      <h2>Session Hosting</h2>

      <p style="margin-top:10px;color:#dbeaff;">
        Coming Soon...
      </p>

      <!-- GUIDE BUTTON -->
      <a class="btn" id="guideButton" href="#" download>
        📋 GUIDE TRAINING
      </a>

      <!-- HARU HUB -->
      <a class="btn"
         href="https://nexusvoids.github.io/Haru-Hub/"
         target="_blank">
         🌐 OPEN HARU HUB
      </a>

    </div>

  </div>

  <!-- CODE BUTTON -->
  <button class="code-btn" onclick="openPopup()">
    🔐 CODE!
  </button>

  <!-- POPUP -->
  <div class="popup" id="popup">

    <h2>Guide Access</h2>

    <input type="password"
           id="codeInput"
           placeholder="Enter Code">

    <button onclick="verifyCode()">
      VERIFY CODE
    </button>

    <div id="fileArea" style="display:none;">

      <input type="file" id="guideFile">

      <button onclick="setGuide()">
        SET GUIDE FILE
      </button>

    </div>

    <div class="status" id="status"></div>

  </div>

  <footer>
    © 2026 Kharú Management
  </footer>

  <script>

    let selectedGuideURL = "";

    function openPopup(){
      document.getElementById("popup").style.display = "block";
    }

    function verifyCode(){

      const code = document.getElementById("codeInput").value;
      const status = document.getElementById("status");

      if(code === "HARU23R"){
        status.innerHTML = "✅ Correct Code";
        document.getElementById("fileArea").style.display = "block";
      }
      else{
        status.innerHTML = "❌ Wrong Code";
      }
    }

    function setGuide(){

      const fileInput = document.getElementById("guideFile");
      const status = document.getElementById("status");

      if(fileInput.files.length > 0){

        const file = fileInput.files[0];

        selectedGuideURL = URL.createObjectURL(file);

        const guideButton = document.getElementById("guideButton");

        guideButton.href = selectedGuideURL;
        guideButton.download = file.name;

        status.innerHTML = "✅ Guide File Set Successfully";
      }
      else{
        status.innerHTML = "❌ Please Select A File";
      }
    }

  </script>

</body>
</html>
