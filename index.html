<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kharú Management</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;
      background: linear-gradient(135deg, #001E44, #003B7A, #0A5EB0);
      overflow:hidden;
      color:white;
    }

    .bg-glow{
      position:absolute;
      width:600px;
      height:600px;
      background:rgba(255,255,255,0.08);
      filter:blur(120px);
      border-radius:50%;
      top:-150px;
      right:-150px;
    }

    .container{
      position:relative;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      height:100vh;
      text-align:center;
      padding:20px;
    }

    h1{
      font-size:70px;
      margin-bottom:10px;
      letter-spacing:2px;
      text-shadow:0 0 20px rgba(255,255,255,0.2);
    }

    .subtitle{
      font-size:20px;
      color:#d6e7ff;
      margin-bottom:40px;
    }

    .card{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      backdrop-filter:blur(12px);
      padding:35px;
      border-radius:25px;
      width:400px;
      box-shadow:0 0 30px rgba(0,0,0,0.3);
    }

    .coming{
      font-size:30px;
      margin-bottom:25px;
      font-weight:bold;
    }

    .btn{
      display:block;
      width:100%;
      padding:15px;
      margin-top:15px;
      border:none;
      border-radius:15px;
      background:#ffffff;
      color:#003B7A;
      font-size:18px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
      text-decoration:none;
    }

    .btn:hover{
      transform:scale(1.03);
      background:#dbeaff;
    }

    footer{
      position:absolute;
      bottom:20px;
      color:#d6e7ff;
      font-size:14px;
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="container">

    <h1>Kharú Management</h1>
    <div class="subtitle">
      Professional Session Hosting & Training System
    </div>

    <div class="card">

      <div class="coming">
        Session Hosting
      </div>

      <p style="margin-bottom:20px; color:#d6e7ff;">
        Coming Soon...
      </p>

      <!-- DOWNLOAD GUIDE -->
      <a class="btn" href="TRAINING GUIDE.txt" download>
        GUIDE TRAINING
      </a>

      <!-- EXTERNAL WEBSITE -->
      <a class="btn" 
         href="https://nexusvoids.github.io/Haru-Hub/" 
         target="_blank">
         OPEN HARU HUB
      </a>

    </div>

    <footer>
      © 2026 Kharú Management
    </footer>

  </div>

</body>
</html>
